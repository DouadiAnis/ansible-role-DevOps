---
- name: restart apache
  service:
    name: "{{ apache_pkg }}"
    state: restarted

- name: restart mariadb
  ansible.builtin.service:
    name: mariadb
    state: restarted
  when: ansible_os_family == 'Debian'

- name: reload apache
  service:
    name: "{{ apache_pkg }}"
    state: reloaded
